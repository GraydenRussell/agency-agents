<title>Life OS Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — fixed sidebar on desktop, top bar + bottom tab bar on phones; one scrolling main pane. */
:root {
  --bg: #1c1d1f; --surface: #242628; --surface-2: #2c2f32; --border: #383b3f; --fg: #ececec; --muted: #a2a6ab;
  --primary: #0f74c4; --primary-text: #4db3ff; --on-primary: #ffffff; --cyan: #66ddfa;
  --warn: #f5b301; --warn-bg: rgba(245,179,1,.12); --danger: #f26464; --danger-bg: rgba(242,100,100,.12);
  --ok: #3fd39a; --ok-bg: rgba(63,211,154,.12); --sel: rgba(15,116,196,.22); --shadow: 0 10px 30px rgba(0,0,0,.45);
  --display: "Bebas Neue", "Oswald", Impact, "Arial Narrow", sans-serif;
  --body: "Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f5f7f9; --surface: #ffffff; --surface-2: #eef1f4; --border: #dde2e7; --fg: #1d2125; --muted: #5a636d;
  --primary: #0070c0; --primary-text: #00579a; --on-primary: #ffffff; --cyan: #0b7c99;
  --warn: #9a6a00; --warn-bg: rgba(245,179,1,.16); --danger: #c03030; --danger-bg: rgba(220,60,60,.10);
  --ok: #117a52; --ok-bg: rgba(30,170,110,.12); --sel: rgba(0,112,192,.12); --shadow: 0 10px 30px rgba(20,30,40,.14);
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f5f7f9; --surface: #ffffff; --surface-2: #eef1f4; --border: #dde2e7; --fg: #1d2125; --muted: #5a636d;
  --primary: #0070c0; --primary-text: #00579a; --on-primary: #ffffff; --cyan: #0b7c99;
  --warn: #9a6a00; --warn-bg: rgba(245,179,1,.16); --danger: #c03030; --danger-bg: rgba(220,60,60,.10);
  --ok: #117a52; --ok-bg: rgba(30,170,110,.12); --sel: rgba(0,112,192,.12); --shadow: 0 10px 30px rgba(20,30,40,.14);
  color-scheme: light; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary-text); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.app { display: grid; grid-template-columns: 232px minmax(0,1fr); height: 100%; }
.side { border-right: 1px solid var(--border); padding: 18px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-family: var(--display); font-size: 20px; }
.brand b { font-family: var(--display); font-size: 24px; letter-spacing: .04em; font-weight: 400; }
.search { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; background: transparent; border: 1px solid var(--border); border-radius: 9px; padding: 7px 10px; color: var(--muted); text-align: left; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; color: var(--muted); background: var(--surface-2); }
.navg { display: flex; flex-direction: column; gap: 2px; }
.navg p { margin: 6px 8px 4px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.nav { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; border: 0; background: transparent; text-align: left; width: 100%; }
.nav:hover { background: var(--surface-2); }
.nav[aria-current="page"] { background: var(--sel); color: var(--fg); font-weight: 500; }
.nav svg { width: 17px; height: 17px; flex: none; }
.nav .ct { margin-left: auto; min-width: 20px; height: 18px; border-radius: 9px; background: var(--primary); color: var(--on-primary); font-size: 11px; display: grid; place-items: center; padding: 0 6px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--muted); }
.main { overflow-y: auto; min-width: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 22px 96px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.demo-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--warn-bg); color: var(--fg); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 18px; }
.demo-bar b { color: var(--warn); font-weight: 600; }
.demo-bar .sp { flex: 1; }
.topbar { display: none; }
.tabbar { display: none; }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.eyebrow { color: var(--muted); font-size: 13px; }
.title { font-family: var(--display); font-weight: 400; font-size: clamp(38px, 5vw, 54px); line-height: .95; letter-spacing: .02em; }
.sub { color: var(--muted); margin-top: 6px; }
.grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 16px; }

.ch { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border); background: transparent; border-radius: 8px; padding: 6px 11px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }

.btn svg { width: 15px; height: 15px; }

.p1 { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 55%, transparent); }
.p2 { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
.p3 { color: var(--primary-text); border-color: color-mix(in srgb, var(--primary-text) 45%, transparent); }
.p4 { color: var(--muted); border-color: var(--border); }
.tag { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--muted); }
.a-business { background: #2f8fe0; } .a-personal { background: #b58cf0; } .a-health { background: #3fd39a; } .a-money { background: #f5b301; } .a-learning { background: #66ddfa; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.capture { width: 100%; display: flex; align-items: center; gap: 10px; border: 1px dashed var(--border); background: transparent; border-radius: 12px; padding: 12px 14px; color: var(--muted); text-align: left; margin-bottom: 16px; }
.capture svg { width: 18px; height: 18px; color: var(--cyan); }
.capture span { flex: 1; }
.task { display: flex; align-items: flex-start; gap: 12px; padding: 10px 2px; border-top: 1px solid var(--border); }
.task:first-child { border-top: 0; }
.chk { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 2px solid var(--muted); background: transparent; display: grid; place-items: center; margin-top: 1px; padding: 0; }
.chk.on { background: var(--ok); border-color: var(--ok); color: #08261a; }
.chk svg { width: 12px; height: 12px; }
.task .t { flex: 1; min-width: 0; }
.task .tt { display: block; }
.task.done .tt { text-decoration: line-through; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 3px; align-items: center; }

.star svg { width: 17px; height: 17px; }
.sched { display: flex; flex-direction: column; gap: 6px; }
.blk { display: grid; grid-template-columns: 70px minmax(0,1fr) auto; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; border-left: 3px solid var(--border); font-size: 13px; }

.blk .w { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.kpi { background: var(--surface-2); border-radius: 10px; padding: 10px 8px; text-align: center; }
.kpi b { display: block; font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi.c b { color: var(--cyan); }
.kpi span { font-size: 11px; color: var(--muted); }
.wx { display: flex; align-items: center; gap: 12px; }
.wx b { font-family: var(--display); font-size: 46px; font-weight: 400; line-height: 1; }
.hours { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; margin-top: 10px; }
.hours div { background: var(--surface-2); border-radius: 7px; text-align: center; padding: 5px 0; font-size: 11px; font-variant-numeric: tabular-nums; }
.hours i { display: block; color: var(--muted); font-style: normal; }
.water { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar { height: 8px; border-radius: 6px; background: var(--surface-2); overflow: hidden; flex: 1; min-width: 120px; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 6px; transition: width .3s; }
.habit { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; }
.habit .streak { color: var(--warn); font-size: 12px; }
.list { display: flex; flex-direction: column; }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--border); font-size: 13px; }
.row:first-child { border-top: 0; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.filters input, .filters select { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; min-width: 0; }
.filters input { flex: 1; min-width: 160px; }
.board { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.lane { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; min-height: 260px; display: flex; flex-direction: column; gap: 8px; transition: background .15s, border-color .15s; }
.lane.over { border-color: var(--primary-text); background: var(--sel); }
.lane h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; display: flex; justify-content: space-between; }
.kcard { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; cursor: grab; display: flex; flex-direction: column; gap: 6px; }
.kcard.dragging { opacity: .45; }
.kcard .mv { display: flex; gap: 4px; justify-content: flex-end; }
.cal { display: grid; grid-template-columns: minmax(0,1fr) 230px; gap: 14px; }
.week { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow-x: auto; }
.wgrid { display: grid; grid-template-columns: 52px repeat(7, minmax(92px, 1fr)); min-width: 720px; position: relative; }
.whead { position: sticky; top: 0; background: var(--surface); text-align: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--muted); z-index: 2; }
.whead b { display: block; font-family: var(--display); font-size: 22px; font-weight: 400; color: var(--fg); line-height: 1.1; }
.whead.today b { color: var(--on-primary); background: var(--primary); border-radius: 50%; width: 32px; height: 32px; display: grid; place-items: center; margin: 2px auto 0; }
.hr { height: 44px; border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); position: relative; }
.hr.slot:hover, .hr.slot.target { background: var(--sel); }
.hl { font-size: 10px; color: var(--muted); text-align: right; padding-right: 6px; height: 44px; transform: translateY(-6px); font-variant-numeric: tabular-nums; }
.cev { position: absolute; left: 3px; right: 3px; border-radius: 7px; padding: 3px 6px; font-size: 11px; line-height: 1.25; overflow: hidden; z-index: 1; border-left: 3px solid var(--primary); background: color-mix(in srgb, var(--primary) 28%, var(--surface)); }
.cev.job { border-left-color: var(--cyan); background: color-mix(in srgb, var(--cyan) 18%, var(--surface)); }
.cev.routine { border-left-color: var(--border); background: var(--surface-2); color: var(--muted); }
.cev.task-b { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, var(--surface)); }
.tray { display: flex; flex-direction: column; gap: 6px; }
.titem { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 7px 9px; font-size: 12px; cursor: grab; text-align: left; width: 100%; }
.titem.picked { border-color: var(--primary-text); background: var(--sel); }
.titem span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inbox { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 14px; }
.thread { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 0; border-top: 0; padding: 11px 13px; display: flex; flex-direction: column; gap: 2px; }
.thread:first-child { border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
.thread:last-child { border-radius: 0 0 12px 12px; }
.thread:only-child { border-radius: 12px; }
.thread[aria-current="true"] { background: var(--sel); }
.thread .top { display: flex; justify-content: space-between; gap: 8px; }
.thread .from { font-weight: 600; display: flex; align-items: center; gap: 7px; }
.thread .subj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prio { width: 8px; height: 8px; border-radius: 50%; }
.cat { font-size: 10px; border-radius: 4px; padding: 0 5px; font-weight: 600; }
.c-customer { color: var(--primary-text); background: var(--sel); } .c-lead { color: var(--ok); background: var(--ok-bg); }
.c-vendor { color: var(--warn); background: var(--warn-bg); } .c-personal { color: #c79bff; background: rgba(181,140,240,.14); }
.c-newsletter, .c-spam { color: var(--muted); background: var(--surface-2); }
.mail { white-space: pre-wrap; background: var(--surface-2); border-radius: 10px; padding: 12px; font-size: 13px; }
.ai { border: 1px solid color-mix(in srgb, var(--cyan) 35%, transparent); background: color-mix(in srgb, var(--cyan) 7%, transparent); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.ai b { color: var(--cyan); }
textarea { width: 100%; min-height: 120px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; resize: vertical; }
.chat { display: flex; flex-direction: column; height: calc(100vh - 210px); min-height: 420px; }
.msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 2px 12px; }
.me { align-self: flex-end; background: var(--primary); color: var(--on-primary); border-radius: 16px 16px 4px 16px; padding: 8px 13px; max-width: 80%; }
.bot { align-self: flex-start; max-width: 88%; display: flex; flex-direction: column; gap: 6px; }
.tool { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.tool svg { width: 13px; height: 13px; color: var(--ok); }
.appr { border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); background: var(--warn-bg); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.appr h4 { margin: 0; color: var(--warn); font-size: 13px; display: flex; gap: 6px; align-items: center; }
.appr pre { margin: 0; white-space: pre-wrap; font-family: var(--body); font-size: 13px; }
.appr .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chip { border: 1px solid var(--border); background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 12px; }
.chip:hover { background: var(--surface-2); }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { min-height: 46px; max-height: 140px; }
.typing span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
.empty { border: 1px dashed var(--border); border-radius: 14px; padding: 32px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); margin-bottom: 4px; }
.setup-item { display: flex; flex-direction: column; gap: 8px; }
.setup-item .hd { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.setup-item h3 { font-size: 15px; font-weight: 600; }
.st { font-size: 11px; font-weight: 600; border-radius: 6px; padding: 1px 7px; }
.st.ok { color: var(--ok); background: var(--ok-bg); } .st.no { color: var(--muted); border: 1px solid var(--border); } .st.req { color: var(--fg); background: var(--surface-2); }
.setup-item ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border-radius: 5px; padding: 1px 5px; overflow-wrap: anywhere; }
.prog { height: 8px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--primary); transition: width .4s; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: grid; place-items: start center; padding: 12vh 16px 16px; z-index: 50; }
.dialog { width: min(600px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.dialog input { width: 100%; border: 0; border-bottom: 1px solid var(--border); background: transparent; padding: 14px 16px; font-size: 15px; outline: none; }
.plist { max-height: 340px; overflow-y: auto; padding: 6px; }
.pitem { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: transparent; border-radius: 8px; padding: 9px 10px; text-align: left; }
.pitem[aria-selected="true"] { background: var(--sel); }
.pitem kbd { margin-left: auto; }
.pitem svg { width: 16px; height: 16px; color: var(--muted); }
.parse { padding: 10px 16px 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.toasts { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 11px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; animation: up .2s ease-out; }
.toast span { flex: 1; }
@keyframes up { from { transform: translateY(8px); opacity: 0 } to { transform: none; opacity: 1 } }
.act { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--border); }
.act:first-child { border-top: 0; }
.act .when { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.act.undone .what { text-decoration: line-through; color: var(--muted); }
.who { font-size: 10px; font-weight: 600; border-radius: 4px; padding: 0 5px; background: var(--surface-2); color: var(--muted); }
.who.ai { color: var(--cyan); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0,1fr); grid-template-rows: auto minmax(0,1fr); }
  .side { display: none; }
  .topbar { display: flex; align-items: center; gap: 8px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--border); background: var(--bg); }
  .topbar .brand { padding: 0; flex: 1; }

// ---------- capture parsing (mirrors the app's rule-based parser) ----------
function parseCapture(text) {
  let s = " " + text + " "; const out = { title: "", pri: 3, area: "business", due: "", time: null };
  const p = s.match(/\s!([1-4])\s/); if (p) { out.pri = +p[1]; s = s.replace(p[0], " "); }
  const a = s.match(/\s#(\w+)\s/); if (a && AREAS.includes(a[1].toLowerCase())) { out.area = a[1].toLowerCase(); s = s.replace(a[0], " "); }
  const tm = s.match(/\s(?:at\s)?(\d{1,2})(?::(\d{2}))?\s?(am|pm)\s/i);
  if (tm) { let h = +tm[1] % 12 + (tm[3].toLowerCase() === "pm" ? 12 : 0); out.time = h + (tm[2] ? +tm[2] / 60 : 0); s = s.replace(tm[0], " "); }
  const d = s.match(/\s(today|tonight|tomorrow|monday|tuesday|wednesday|thursday|friday|saturday|sunday|next week)\s/i);
  if (d) { out.due = d[1][0].toUpperCase() + d[1].slice(1).toLowerCase(); s = s.replace(d[0], " "); }
  if (out.time != null) out.due = `${out.due || "Today"} ${fmtH(out.time)}`;
  out.title = s.replace(/\s+/g, " ").trim();
  out.title = out.title.charAt(0).toUpperCase() + out.title.slice(1);
  return out;
}

function vCalendar() {

  let body = `<div>${[...Array(H1 - H0)].map((_, i) => `<div class="hl">${fmtH(H0 + i)}</div>`).join("")}</div>`;

    body += `<div style="position:relative">${[...Array(H1 - H0)].map((_, i) => `<div class="hr slot" data-act="slot" data-d="${rel}" data-h="${H0 + i}" data-drop="1"></div>`).join("")}

// ---------- drag & drop ----------
function bindBoard() {
  document.querySelectorAll(".kcard").forEach((c) => {
    c.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", c.dataset.card); c.classList.add("dragging"); });
    c.addEventListener("dragend", () => c.classList.remove("dragging"));
  });
  document.querySelectorAll(".lane").forEach((l) => {
    l.addEventListener("dragover", (e) => { e.preventDefault(); l.classList.add("over"); });
    l.addEventListener("dragleave", () => l.classList.remove("over"));
    l.addEventListener("drop", (e) => { e.preventDefault(); l.classList.remove("over"); moveTask(e.dataTransfer.getData("text/plain"), l.dataset.lane); });
  });
}
function moveTask(id, to) {
  const t = S.tasks.find((x) => x.id === id); if (!t || t.status === to) return;
  const prev = { status: t.status }; t.status = to;
  const label = { todo: "To do", doing: "Doing", done: "Done" }[to];
  const a = log(`Moved "${t.title}" to ${label}`, "You", { type: "restoreTask", id, prev });
  save(); render(); toast(`Moved to ${label}`, () => runUndo(a));
}
function bindCalendar() {
  document.querySelectorAll("[data-tray]").forEach((c) => c.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", c.dataset.tray)));
  document.querySelectorAll("[data-drop]").forEach((s) => {
    s.addEventListener("dragover", (e) => { e.preventDefault(); s.classList.add("target"); });
    s.addEventListener("dragleave", () => s.classList.remove("target"));
    s.addEventListener("drop", (e) => { e.preventDefault(); s.classList.remove("target"); timeBlock(e.dataTransfer.getData("text/plain"), +s.dataset.d, +s.dataset.h); });
  });
}
function timeBlock(id, d, h) {
  const t = S.tasks.find((x) => x.id === id); if (!t) return;
  const b = { id: uid(), d, s: h, e: h + Math.max(0.5, t.est / 60), title: t.title, kind: "task-b", taskId: t.id };
  S.blocks.push(b); ui.picked = null;
  const day = weekDays()[todayIdx() + d];
  const a = log(`Time-blocked "${t.title}" ${day ? `${day.dow} ` : ""}${fmtH(h)}`, "You", { type: "removeBlock", id: b.id });
  save(); render(); toast(`Blocked ${fmtH(h)} for "${t.title}"`, () => runUndo(a));
}

// ---------- approvals ----------
function queueReply(threadId, text, from = "You") {
  const th = S.threads.find((t) => t.id === threadId); if (!th) return null;
  const a = { id: uid(), kind: "Send reply", short: `to ${th.from}`, summary: `Send reply to ${th.from} re: "${th.subject}":\n\n${text}`, threadId, status: "pending" };
  S.approvals.unshift(a); log(`Queued reply to ${th.from} for approval`, from); save(); return a;
}
function decide(id, ok) {
  const a = S.approvals.find((x) => x.id === id); if (!a || a.status !== "pending") return;
  a.status = ok ? "approved" : "rejected";
  if (ok && a.threadId) {
    const th = S.threads.find((t) => t.id === a.threadId); th.needs = false; th.replied = true; th.unread = false;
    const act = log(`Sent reply to ${th.email}`, "AI", { type: "unsend", id: th.id });
    toast(`Sent to ${th.from}`, () => runUndo(act));
  } else { log(`Rejected: ${a.kind} ${a.short}`); toast("Rejected. Nothing was sent."); }
  save(); render();
}

// ---------- assistant (scripted, offline) ----------
let busy = false;
function ask(q) {
  q = q.trim(); if (!q || busy) return;
  S.chat.push({ role: "me", text: q }); save(); busy = true; render();
  const m = $("#msgs"); if (m) { m.insertAdjacentHTML("beforeend", `<div class="bot typing" id="typing"><span></span><span></span><span></span></div>`); m.scrollTop = m.scrollHeight; }
  setTimeout(() => { busy = false; S.chat.push(reply(q)); save(); render(); }, 700 + Math.random() * 500);
}
function reply(q) {
  const s = q.toLowerCase();
  if (/plan (my )?day|what should i do/.test(s)) {
    const top = S.tasks.filter((t) => t.top3 && t.status !== "done");
    return { role: "bot", tools: ["Reading your calendar", "Reading tasks", "Checking weather"], html: `<p>Here's a plan around your jobs and the heat:</p><ul>
      <li><b>10:30–11:00</b> ${esc(top[0]?.title || "Inbox zero")} (before the clubhouse job)</li>
      <li><b>1:30–2:00</b> Reply to Linda and Jennifer (both are waiting on you)</li>
      <li><b>3:00</b> ${esc(top[1]?.title || "Calls")} (after 10am, per your preference)</li>
      <li><b>6:00</b> ${esc(top[2]?.title || "Workout")}: 91° by then, so bring water</li></ul><p class="muted small">Say "block those" in the real app and it adds them to your calendar.</p>` };
  }
  if (/^(add|create) (a )?task|^remind me to|^todo/.test(s)) {
    const text = q.replace(/^(add|create) (a )?task|^remind me to|^todo/i, "").trim();
    const r = addTask(text, "AI");
    return r ? { role: "bot", tools: ["Creating task"], html: `<p>Added <b>${esc(r.t.title)}</b> ${priPill(r.t.pri)} ${areaTag(r.t.area)}${r.t.due ? ` · ${esc(r.t.due)}` : ""}. Undo is in the Activity Log.</p>` }
      : { role: "bot", html: "<p>What should the task say?</p>" };
  }
  if (/reply to|respond to|email (back )?to|tell (linda|jennifer|mom|marcus)/.test(s)) {
    const who = /linda/.test(s) ? "t1" : /jennifer|jen\b|lead|ocotillo/.test(s) ? "t2" : /mom/.test(s) ? "t3" : /marcus|invoice|vendor/.test(s) ? "t4" : "t1";
    const th = S.threads.find((t) => t.id === who);
    if (th.replied) return { role: "bot", html: `<p>You already replied to ${esc(th.from)}.</p>` };
    const said = q.match(/saying (.+)$/i);
    const text = said ? `Hi ${th.from.split(" ")[0]},\n\n${said[1].charAt(0).toUpperCase() + said[1].slice(1)}${/[.!?]$/.test(said[1]) ? "" : "."}\n\nThanks,\nGrayden` : DRAFTS[who];
    const a = queueReply(who, text, "AI");
    return { role: "bot", tools: ["Reading the thread", "Drafting in your voice"], approvalId: a.id, html: `<p>Here's the reply to ${esc(th.from)}. It won't send until you tap <b>Approve</b> (here or on the Approvals page).</p>` };
  }
  if (/needs? (a )?repl|what.*inbox|important email|unread/.test(s)) {
    const n = S.threads.filter((t) => t.needs);
    return { role: "bot", tools: ["Searching email"], html: n.length ? `<p>${n.length} need a reply, most important first:</p><ul>${n.sort((a, b) => b.pri - a.pri).map((t) => `<li><b>${esc(t.from)}</b>: ${esc(t.summary)}</li>`).join("")}</ul><p>Want me to draft the one to Linda?</p>` : "<p>Inbox is clear. Nothing needs a reply.</p>" };
  }
  if (/business|revenue|numbers|money|how.*doing|leads/.test(s))
    return { role: "bot", tools: ["Business numbers"], html: "<p><b>$1,180</b> booked today across 3 jobs; <b>$6,940</b> this week. October is on pace for <b>$31.4k</b>, about 8% ahead of last year. 3 new leads; Jennifer Alvarez (Ocotillo, 2-story) is the warmest and hasn't heard back yet.</p>" };
  if (/free|find .*time|hours? for|when can i/.test(s))
    return { role: "bot", tools: ["Finding free time"], html: "<p>Open 2-hour windows this week:</p><ul><li>Tomorrow 1:00–3:00 PM</li><li>Thursday 9:30–11:30 AM</li><li>Friday 1:00–3:00 PM</li></ul><p class=\"muted small\">The real assistant can book one for you; events with other people wait for your approval.</p>" };
  if (/^remember|don'?t forget that|note that/.test(s)) {
    const v = q.replace(/^(remember( that)?|don'?t forget that|note that)/i, "").trim();
    const k = "preference." + (v.toLowerCase().match(/[a-z]+/g) || ["note"]).slice(0, 2).join("-");
    S.memory.push({ k, v }); const a = log(`Remembered ${k}: ${v}`, "AI", { type: "forget", k });
    return { role: "bot", tools: ["Saving to memory"], html: `<p>Got it. I'll remember: <i>${esc(v)}</i>. You can see and edit memories in Settings.</p>` };
  }
  if (/weather|hot|heat/.test(s)) return { role: "bot", tools: ["Checking weather"], html: "<p>84° now, high of 96° around 2 PM, UV 7. Fine for exterior work this morning; push ladder work before 1 PM.</p>" };
  return { role: "bot", html: `<p>In this demo I can plan your day, add tasks, draft replies (they wait for your approval), check the inbox, give business numbers, find free time, and remember preferences. With your Anthropic key connected, the real assistant handles anything you'd ask.</p>` };
}

// ---------- palette & capture ----------
function openPalette(mode = "palette") {
  const isCap = mode === "capture";
  $("#layer").innerHTML = `<div class="overlay" data-act="close"><div class="dialog" role="dialog" aria-modal="true" aria-label="${isCap ? "Quick capture" : "Command palette"}">
    <input id="pin" autocomplete="off" placeholder="${isCap ? "Capture… e.g. call Linda tomorrow 3pm !1 #business" : "Jump to a page or run a command…"}" aria-label="${isCap ? "Capture text" : "Search"}">
    <div id="pout"></div></div></div>`;
  const inp = $("#pin"); let sel = 0;
  const cmds = () => [...NAV.map((n) => ({ label: `Go to ${n.label}`, icon: n.icon, key: `G ${n.key.toUpperCase()}`, run: () => go(n.id) })),
    { label: "Quick capture", icon: "bolt", key: "C", run: () => openPalette("capture") },
    { label: "Ask the assistant: plan my day", icon: "bot", run: () => { go("assistant"); ask("Plan my day"); } },
    { label: "Generate today's brief", icon: "spark", run: () => { S.brief = true; save(); go("today"); } },
    { label: "Toggle light/dark theme", icon: "sun", run: () => cycleTheme() },
    ...S.tasks.filter((t) => t.status !== "done").map((t) => ({ label: t.title, icon: "check", hint: "task", run: () => { go("tasks"); } }))];
  const draw = () => {
    const q = inp.value.trim();
    if (isCap) {
      const p = parseCapture(q);
      $("#pout").innerHTML = q ? `<div class="parse">Creates task: <b style="color:var(--fg)">${esc(p.title || "…")}</b> ${priPill(p.pri)} ${areaTag(p.area)} ${p.due ? `<span class="tag">${esc(p.due)}</span>` : ""}<span style="margin-left:auto"><kbd>Enter</kbd></span></div>` : `<div class="parse">Understands <code>!1</code>–<code>!4</code> priority, <code>#business</code> <code>#health</code> areas, “tomorrow”, “friday”, “3pm”.</div>`;
      return;
    }
    const list = cmds().filter((c) => !q || c.label.toLowerCase().includes(q.toLowerCase())).slice(0, 9);
    sel = Math.min(sel, Math.max(0, list.length - 1));
    $("#pout").innerHTML = `<div class="plist" role="listbox">${list.map((c, i) => `<button class="pitem" role="option" aria-selected="${i === sel}" data-i="${i}">${ico(c.icon)}<span>${esc(c.label)}</span>${c.key ? `<kbd>${c.key}</kbd>` : c.hint ? `<span class="muted small" style="margin-left:auto">${c.hint}</span>` : ""}</button>`).join("") || `<div class="parse">No matches. Press Enter to capture “${esc(q)}” as a task.</div>`}</div>`;
    $("#pout").querySelectorAll(".pitem").forEach((b) => b.onclick = () => { closeLayer(); list[+b.dataset.i].run(); });
    inp._list = list;
  };
  inp.addEventListener("input", () => { sel = 0; draw(); });
  inp.addEventListener("keydown", (e) => {
    if (e.key === "Escape") return closeLayer();
    if (!isCap && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); sel = Math.max(0, sel + (e.key === "ArrowDown" ? 1 : -1)); draw(); }
    if (e.key === "Enter") {
      e.preventDefault(); const q = inp.value.trim();
      if (isCap || !(inp._list || []).length) { if (!q) return; const r = addTask(q); closeLayer(); render(); if (r) toast(`Task added: ${r.t.title}`, () => runUndo(r.a)); return; }
      const c = inp._list[sel]; closeLayer(); c?.run();
    }
  });
  draw(); setTimeout(() => inp.focus(), 0);
}
function closeLayer() { $("#layer").innerHTML = ""; }

// ---------- theme ----------
let theme = "system";
try { theme = localStorage.getItem("lifeos-demo-theme") || "system"; } catch { /* default */ }
function applyTheme() { if (theme === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme); $("#themeBtn").textContent = `Theme: ${theme}`; }
function cycleTheme() { theme = theme === "system" ? "dark" : theme === "dark" ? "light" : "system"; try { localStorage.setItem("lifeos-demo-theme", theme); } catch { /* ignore */ } applyTheme(); }

// ---------- events ----------
document.addEventListener("click", (e) => {
  const n = e.target.closest("[data-nav]"); if (n) { go(n.dataset.nav); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "close") { if (e.target === el) closeLayer(); return; }
  if (act === "palette") return openPalette();
  if (act === "capture") return openPalette("capture");
  if (act === "theme") return cycleTheme();
  if (act === "more") { ui.more = !ui.more; return render(); }
  if (act === "reset") { S = seed(); ui.thread = "t1"; ui.draft = {}; save(); render(); return toast("Demo reset to sample data"); }
  if (act === "toggle") {
    const t = S.tasks.find((x) => x.id === id); const prev = { status: t.status }; t.status = t.status === "done" ? "todo" : "done";
    const a = log(`${t.status === "done" ? "Completed" : "Reopened"} "${t.title}"`, "You", { type: "restoreTask", id, prev });
    save(); render(); return toast(t.status === "done" ? "Done" : "Reopened", () => runUndo(a));
  }
  if (act === "star") {
    const t = S.tasks.find((x) => x.id === id);
    if (!t.top3 && S.tasks.filter((x) => x.top3).length >= 3) return toast("Top 3 is full. Unstar one first.");
    t.top3 = !t.top3; save(); return render();
  }
  if (act === "brief") { S.brief = !S.brief; if (S.brief) log("Generated today's brief", "AI"); save(); return render(); }
  if (act === "water") { S.water = Math.min(160, S.water + +el.dataset.oz); log(`Logged ${el.dataset.oz} oz water`); save(); render(); return toast(`+${el.dataset.oz} oz · ${S.water} oz today`); }
  if (act === "tview") { ui.taskView = el.dataset.v; return render(); }
  if (act === "move") return moveTask(id, el.dataset.to);
  if (act === "pick") { ui.picked = ui.picked === id ? null : id; render(); if (ui.picked) toast("Now tap a time on the calendar"); return; }
  if (act === "slot") { if (ui.picked) timeBlock(ui.picked, +el.dataset.d, +el.dataset.h); return; }
  if (act === "thread") { ui.thread = id; const t = S.threads.find((x) => x.id === id); t.unread = false; save(); return render(); }
  if (act === "draft") { ui.draft[id] = DRAFTS[id] || "Thanks, got it.\n\nGrayden"; log(`AI drafted a reply to ${S.threads.find((t) => t.id === id).from}`, "AI"); save(); return render(); }
  if (act === "send") { const text = $("#draftBox")?.value || ""; queueReply(id, text); delete ui.draft[id]; render(); return toast("Waiting for your approval (Approvals)"); }
  if (act === "archive") { const t = S.threads.find((x) => x.id === id); t.needs = false; log(`Archived "${t.subject}"`); save(); render(); return toast("Archived"); }
  if (act === "synced") return toast("Inbox synced (sample)");
  if (act === "approve") return decide(id, true);
  if (act === "reject") return decide(id, false);
  if (act === "undo") return runUndo(S.activity.find((a) => a.id === id));
  if (act === "ask") return ask(el.dataset.q);
  if (act === "ask-go") { go("assistant"); return ask(el.dataset.q); }
  if (act === "newchat") { S.chat = []; save(); return render(); }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.act === "habit") { S.habits[el.dataset.k] = el.checked; save(); render(); }
  if (el.dataset.act === "setup") { S.setup[el.dataset.id] = el.checked; save(); render(); }
  if (el.id === "taskArea") { ui.taskArea = el.value; render(); }
});
document.addEventListener("input", (e) => { if (e.target.id === "taskQ") { ui.taskQ = e.target.value; const pos = e.target.selectionStart; render(); const i = $("#taskQ"); i.focus(); i.setSelectionRange(pos, pos); } });
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "newTask") { const v = $("#newTaskInput").value; const r = addTask(v); render(); if (r) toast(`Task added: ${r.t.title}`, () => runUndo(r.a)); setTimeout(() => $("#newTaskInput")?.focus(), 0); }
  if (e.target.id === "composer") { const v = $("#askBox").value; ask(v); }
});
document.addEventListener("keydown", (e) => {
  if (e.target.id === "askBox" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(e.target.value); return; }
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); return openPalette(); }
  if (typing || $("#layer").innerHTML) return;
  if (e.key === "c") { e.preventDefault(); return openPalette("capture"); }
  if (e.key === "g") { window._g = Date.now(); return; }
  if (window._g && Date.now() - window._g < 1200) { const n = NAV.find((x) => x.key === e.key.toLowerCase()); window._g = 0; if (n) go(n.id); }
});

applyTheme();
render();
})();
</script>
